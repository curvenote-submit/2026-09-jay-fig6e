[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-zarr"
version = "0.1.0"
description = "Convert STEAM-v1 hg38-projected bigwigs into the GPS uint8 Zarr store read by the Fig 6e widget"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pyBigWig>=0.3.22,<0.4",
  "zarr>=3,<4",
  "biopython>=1.81,<2",
]

[project.scripts]
steam-zarr = "steam_zarr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["steam_zarr*"]
